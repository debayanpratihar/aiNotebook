name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref; Android builds are slow and there is no
  # value in finishing a run whose commit is already stale.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The llama.cpp submodule is checked out but NOT compiled in CI. Building ggml for two ABIs adds
  # roughly 20 minutes and verifies nothing about the Kotlin under test — MediaPipe is the default
  # local backend and the GGUF path degrades gracefully when the .so is absent. The dedicated
  # `native` job below covers the native build on demand.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
  NATIVE_OPT_OUT: -Painotebook.native.llama=false

jobs:
  unit-tests:
    name: Unit tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Skip the llama.cpp submodule: it is ~200 MB and this job does not build native code.
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew ${{ env.NATIVE_OPT_OUT }} testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew ${{ env.NATIVE_OPT_OUT }} lintDebug --stacktrace

      - name: Upload test reports
        # Reports are most valuable exactly when the build failed, so this must not be skipped.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14

  assemble:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew ${{ env.NATIVE_OPT_OUT }} assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  native:
    name: Native GGUF backend (${{ matrix.abi }})
    # Opt-in: the native build is slow and the app is fully functional without it. Trigger manually,
    # or on a tag, when you actually intend to ship the GGUF backend.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # arm64-v8a is the only ABI where the int8-dotprod path that makes quantized inference
        # tolerable exists; x86_64 is built so the emulator works. armeabi-v7a is intentionally
        # unsupported for local inference — see data/build.gradle.kts.
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native library
        run: ./gradlew :data:assembleDebug -Pandroid.injected.build.abi=${{ matrix.abi }} --stacktrace

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libainotebook_llama-${{ matrix.abi }}
          path: data/build/intermediates/cxx/**/libainotebook_llama.so
          retention-days: 14
