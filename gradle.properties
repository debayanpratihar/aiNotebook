# Project-wide Gradle settings.

# JVM args for the Gradle daemon (larger heap for KSP + Room + Compose builds).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Build in parallel and cache aggressively.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX.
android.useAndroidX=true

# Kotlin official code style.
kotlin.code.style=official

# Only generate the R class for resources declared in the module itself.
android.nonTransitiveRClass=true
